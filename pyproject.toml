[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gaslight-to-greenlight"
version = "0.1.0"
description = "Journal-backed text-audit component study of prior collaboration and fabricated rapport"
requires-python = ">=3.11,<3.14"
dependencies = ["inspect-ai==0.3.281", "pydantic>=2.10,<3", "PyYAML>=6,<7", "httpx>=0.28,<1", "numpy>=2,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
g2g = "g2g.cli:main"

[project.entry-points.inspect_ai]
g2g = "g2g.inspect_tasks.registry"

[tool.hatch.build.targets.wheel]
packages = ["src/g2g"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
